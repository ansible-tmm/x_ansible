---
# Copy this file to linkedin/vars/credentials.yml and encrypt with Ansible Vault:
#
#   cp linkedin/vars/credentials_example.yml linkedin/vars/credentials.yml
#   # Edit with your real values
#   ansible-vault encrypt linkedin/vars/credentials.yml
#
# Then uncomment the vars_files line in post_to_linkedin.yml.

vault_linkedin_access_token: "REPLACE_WITH_YOUR_ACCESS_TOKEN"
vault_linkedin_person_urn: "urn:li:person:REPLACE_WITH_YOUR_MEMBER_ID"
